# Render blueprint (not deployed yet). Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: finders
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FINDERS_OPERATOR_KEY
        generateValue: true
