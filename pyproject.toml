[project]
name = "finders"
version = "0.1.0"
description = "Finders: lost-and-found with a reward held on PayPal; AI matches finds and checks both sides (sandbox)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27,<1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "nexura-agents==0.9.3",
    "paypal-agent-toolkit==1.11.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.uv]
# Only the PayPal Agent Toolkit's framework-neutral core is used (read-only audit); its framework adapters are not.
override-dependencies = [
    "openai-agents; sys_platform == 'never'",
    "langchain; sys_platform == 'never'",
    "crewai-tools; sys_platform == 'never'",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["paypal_agent_toolkit.*"]
ignore_missing_imports = true
